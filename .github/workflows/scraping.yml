# Recupere chaque jour les nouvelles offres de mediacongo.net, les nettoie et les enregistre dans le depot.
# GitHub ne lance les taches planifiees que sur la branche par defaut du depot : ici main.
name: Scraping quotidien des offres

on:
  schedule:
    - cron: '17 5 * * *'   # tous les jours a 5h17 UTC, soit 6h17 a Kinshasa
  workflow_dispatch:       # bouton "Run workflow" pour le lancer a la main

permissions:
  contents: write          # autorise le robot a enregistrer les nouvelles offres
  actions: write           # autorise le robot a lancer le deploiement (deploy.yml) apres de nouvelles offres

concurrency: scraping      # jamais deux scrapings en meme temps

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer Tesseract (OCR des annonces scannees)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Recuperer les nouvelles offres
        run: python -m data_pipeline.scraper_jobs 5

      - name: Nettoyer les offres
        run: python -m data_pipeline.pandas_cleaning

      - name: Enregistrer les offres dans le depot
        id: enregistrer
        run: |
          git config user.name "cvboost-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/offres_brutes.csv data/offres_propres.csv
          if git diff --cached --quiet; then
            echo "nouvelles=non" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Donnees : offres du $(date +%d/%m/%Y)" && git push
            echo "nouvelles=oui" >> "$GITHUB_OUTPUT"
          fi

      # Un push fait avec le jeton du robot (GITHUB_TOKEN) ne declenche pas deploy.yml (regle de GitHub contre
      # les boucles). Un lancement manuel (workflow_dispatch) est permis : le site est teste puis publie.
      - name: Mettre le site en ligne a jour
        if: steps.enregistrer.outputs.nouvelles == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "${{ github.repository }}"
